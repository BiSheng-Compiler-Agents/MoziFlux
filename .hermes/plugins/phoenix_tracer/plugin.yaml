name: phoenix_tracer
version: 1.1.0
description: "Traces exact post-middleware LLM requests, visual message metadata, and tool calls to Arize Phoenix"
author: "Shayan"
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_reset
