name: kernel-episodes
version: 1.0.0
description: >
  SQLite-backed episode memory for recording and retrieving Triton kernel
  optimization experiences on Ascend NPUs. Each episode captures one
  optimization attempt: what the kernel looked like, the reasoning behind
  the approach, what was changed, and the outcome. Namespaced by kernel_name
  and target hardware for precise recall.
author: "Hermes Agent & Shayan"
requires_env:
  - KERNEL_EPISODES_DB
provides_tools:
  - episode_write
  - episode_update
  - episode_delete
  - episode_retrieve
  - episode_list
